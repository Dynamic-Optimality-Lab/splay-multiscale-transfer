# L6 Pair-Access translation contract — PREREGISTERED v0.3 (immutable after WP-0 seal)
# Freezes the COMPLETE language + PROPOSED definitions of spec S6. WP-2 determines
# which mappings are actually valid (SAME proved; MODIFIED with proved difference;
# NOT_APPLICABLE with preserved justification AND activation of the already-preregistered
# distinct PA-native fallback — never invention) and populates the separate
# math/L6_PAIR_ACCESS_MAPPING.md. A refuted proposed equivalence is recorded separately,
# never as a status value. mapping_status in this file stays UNRESOLVED_PRE_PROOF forever;
# resolution lives in the math mapping doc + freeze certificate.
# No post-WP-0 object invention is permitted. Any genuinely unanticipated object requires
# a new experiment/mapping version and cannot enter the current v0.3 target-facing analysis.
