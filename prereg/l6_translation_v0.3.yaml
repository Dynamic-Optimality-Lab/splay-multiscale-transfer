# L6 Pair-Access translation contract — PREREGISTERED v0.3 (immutable after WP-0 seal)
# Freezes the COMPLETE language + PROPOSED definitions of spec S6. WP-2 determines
# which mappings are actually valid (SAME -> proved equivalent; MODIFIED with proved
# difference; NOT_APPLICABLE / FALSE with preserved justification) and populates the
# separate math/L6_PAIR_ACCESS_MAPPING.md. WP-2 may NOT introduce a new translation
# definition or object not already preregistered here (new version required, never silent).
# Initial mapping_status for every object: UNRESOLVED_PRE_PROOF.
mapping_version: L6MAP-v0.3.1
literature_role_L6: TRANSLATION_TARGET_never_automatic_premise
l6_source_identity: {paper: "Chmel et al., Splay trees are almost dynamically optimal", arxiv: 2607.18498, version_pinned: v1_2026_07_20, bytes_status: pinned_at_literature_freeze_in_external_MANIFEST_json}

# Exact reference-snapshot semantics (S5.2 / S6.1), frozen
reference_snapshot_semantics: KEEP_analysis_freezes_post_A_splay_tree_A1_as_reference_snapshot_for_B_splay_analysis_per_KEEP_REF_SNAPSHOT_v1_steps_1_to_5_DELETE_uses_appropriate_A_snapshot_alternative_conventions_mint_new_versions_with_equivalence_proof_or_explicit_separation
# Exact tie semantics (T14), frozen
tie_semantics: every_heavy_child_choice_rank_tie_gap_sign_tie_lazy_side_tie_pairing_order_tie_bend_orientation_tie_proved_or_explicitly_represented_no_silent_uniqueness_assumption
naming_rule: PA_or_MST_prefix_until_formal_equivalence_proved_and_reviewed
rank_rule: exact_L6_rank_copied_first_never_silently_replaced_by_depth

# Per-object record schema (content filled at WP-0 proposal level; WP-2 proves/rejects)
object_record_schema: [source_identity, proposed_pair_access_definition, mapping_status,
  proof_obligation, implementation_mapping_schema, known_semantic_difference_slot]
status_vocabulary: [UNRESOLVED_PRE_PROOF, SAME_proved_equivalent, MODIFIED_with_proved_difference,
  NOT_APPLICABLE_with_preserved_justification, FALSE_with_preserved_counterexample, baseline_only_role]
wp2_rule: prove_or_reject_statuses_and_populate_math_mapping_doc_no_new_definitions_or_objects_without_new_mapping_version

objects:
  PA_REFERENCE_RANK: {source_identity: "L6 v1 rank definition (exact section pinned at literature freeze)", proposed_pair_access_definition: "L6 rank function evaluated on the KEEP reference snapshot (post-A-splay tree); appropriate A snapshot for DELETE analysis", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_HEAVY_EDGE: {source_identity: "L6 v1 heavy/light edge definition (exact section pinned at literature freeze)", proposed_pair_access_definition: "heavy/light marking from the frozen L6 child-weight rule applied to the reference snapshot", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_HEAVY_PATH: {source_identity: "L6 v1 heavy-path definition (exact section pinned at literature freeze)", proposed_pair_access_definition: "maximal heavy-edge chains under the translated marking, structurally identified", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_LIGHT_EDGE: {source_identity: "L6 v1 heavy/light edge definition (exact section pinned at literature freeze)", proposed_pair_access_definition: "complement of PA_HEAVY_EDGE on the reference snapshot", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_HEAP_VIEW: {source_identity: "L6 v1 heap-view construction (exact section pinned at literature freeze)", proposed_pair_access_definition: "heap-order view (PA_HEAP_PARENT/CHILD_LEFT/CHILD_RIGHT) of the translated heavy paths", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_RAW_GAP: {source_identity: "L6 v1 gap definitions (exact section pinned at literature freeze)", proposed_pair_access_definition: "raw gap object; source-paper gap theorems quarantined until equivalence proved", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_INTERVAL_GAP: {source_identity: "L6 v1 gap definitions (exact section pinned at literature freeze)", proposed_pair_access_definition: "interval gap object; source-paper gap theorems quarantined until equivalence proved", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
