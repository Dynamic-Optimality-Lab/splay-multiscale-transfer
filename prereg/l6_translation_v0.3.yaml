  PAIR_UP: {source_identity: "L6 v1 pair-up operation (exact section pinned at literature freeze)", proposed_pair_access_definition: "translated pair-up op with source paid/free status recorded", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
