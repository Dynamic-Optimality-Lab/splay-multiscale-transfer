  HEAP_CHILD_EXCHANGE: {source_identity: "L6 v1 heap-child-exchange op (exact section pinned at literature freeze)", proposed_pair_access_definition: "translated op with source paid/free status recorded", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}

known_semantic_differences_initial: none_asserted_pre_extraction_WP2_records_findings_in_math_mapping_doc_any_difference_requiring_new_definition_or_object_needs_new_mapping_version
