  PA_LAZY_INTERVAL: {source_identity: "L6 v1 lazy-interval definitions (exact section pinned at literature freeze)", proposed_pair_access_definition: "lazy interval with exact ordering, ownership, interval-contiguity, and update rules", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
  PA_GROWING_INTERVAL: {source_identity: "L6 v1 lazy-interval update rules (exact section pinned at literature freeze)", proposed_pair_access_definition: "lazy interval in growing state per translated update rules", mapping_status: UNRESOLVED_PRE_PROOF, obligation: MST0-03}
